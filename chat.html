<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рабочий Мессенджер</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #0f172a; color: white; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .window { width: 100%; max-width: 400px; height: 100vh; background: #1e293b; display: flex; flex-direction: column; position: relative; }
        
        /* Экран входа */
        .login { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; display: flex; flex-direction: column; justify-content: center; padding: 30px; z-index: 10; }
        .hidden { display: none !important; }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        input { background: #1e293b; border: 2px solid #334155; border-radius: 10px; padding: 12px; color: white; font-size: 16px; width: 100%; outline: none; margin-bottom: 15px; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 12px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        /* Экран чата */
        .messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #0f172a; }
        .msg { max-width: 80%; padding: 10px; border-radius: 12px; font-size: 15px; word-break: break-word; }
        .msg.my { background: #38bdf8; color: #0f172a; align-self: flex-end; }
        .msg.other { background: #334155; color: white; align-self: flex-start; }
        .author { font-size: 11px; opacity: 0.7; margin-bottom: 2px; font-weight: bold; }
        .input-bar { background: #1e293b; padding: 10px; display: flex; gap: 10px; }
    </style>
</head>
<body>

    <div class="window">
        <!-- ЭКРАН ВХОДА -->
        <div class="login" id="loginScreen">
            <h2>Вход в Мессенджер</h2>
            <!-- Исправлен ID на nickInput -->
            <input type="text" id="nickInput" placeholder="Твой никнейм..." maxlength="12">
            <button onclick="login()">Войти в чат</button>
        </div>

        <!-- ЭКРАН ЧАТА -->
        <div class="messages" id="box"></div>
        <div class="input-bar">
            <input type="text" id="txt" placeholder="Сообщение..." style="margin:0;">
            <button onclick="send()">ОТПР</button>
        </div>
    </div>

    <!-- Быстрая база Firebase от Google -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref("global_messages");

        let myName = "";
        const box = document.getElementById('box');

        // Логика кнопки входа
        function login() {
            const nameInput = document.getElementById('nickInput');
            const name = nameInput.value.trim();
            if(!name) {
                alert("Пожалуйста, введи имя!");
                return;
            }
            myName = name;
            document.getElementById('loginScreen').classList.add('hidden');
        }

        // Отправка сообщений
        function send() {
            const txtInput = document.getElementById('txt');
            const text = txtInput.value.trim();
            if(!text) return;
            
            db.push({
                name: myName,
                text: text,
                time: Date.now()
            });
            
            txtInput.value = "";
        }

        // Мгновенное отображение сообщений на экране
        db.limitToLast(50).on('child_added', (snapshot) => {
            const data = snapshot.val();
            const isMy = data.name === myName;
            
            const d = document.createElement('div');
            d.className = isMy ? 'msg my' : 'msg other';
            d.innerHTML = isMy ? `<div>${escapeHTML(data.text)}</div>` : `<div class="author">${escapeHTML(data.name)}</div><div>${escapeHTML(data.text)}</div>`;
            
            box.appendChild(d);
            box.scrollTop = box.scrollHeight;
        });

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
