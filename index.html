<!DOCTYPE html>
<html lang="ru">
<head> <link rel="manifest" href="manifest.json">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anywary Messenger </title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #0f172a; color: white; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .window { width: 100%; max-width: 450px; height: 100vh; background: #1e293b; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        
        /* ЭКРАН ВХОДА */
        .login-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; display: flex; flex-direction: column; justify-content: center; padding: 40px; z-index: 100; transition: all 0.3s ease; }
        .login-screen.hidden { display: none !important; }
        h2 { text-align: center; margin-bottom: 25px; color: #38bdf8; font-size: 26px; }
        input { background: #1e293b; border: 2px solid #334155; border-radius: 12px; padding: 15px; color: white; font-size: 16px; width: 100%; outline: none; margin-bottom: 20px; }
        input:focus { border-color: #38bdf8; }
        .main-btn { background: #38bdf8; color: #0f172a; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .main-btn:hover { background: #7dd3fc; }
        
        /* ЭКРАН ЧАТА */
        .chat-header { background: #1e293b; padding: 15px 20px; border-bottom: 1px solid #334155; font-weight: bold; font-size: 18px; color: #38bdf8; display: flex; justify-content: space-between; align-items: center; }
        .chat-header span { font-size: 14px; color: #94a3b8; }
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #0f172a; }
        
        /* Сообщения */
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 15px; word-break: break-word; line-height: 1.4; animation: fadeIn 0.2s ease; }
        .msg.my { background: #38bdf8; color: #0f172a; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.other { background: #334155; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
        .author { font-size: 11px; opacity: 0.7; margin-bottom: 4px; font-weight: bold; display: block; }
        
        /* Панель ввода */
        .input-bar { background: #1e293b; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #334155; }
        .input-bar input { margin-bottom: 0; flex: 1; padding: 12px; border-radius: 10px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>

    <!-- Подключаем базы данных Google Firebase напрямую -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body>

    <div class="window">
        <!-- 1. ЭКРАН ВХОДА (РЕГИСТРАЦИЯ) -->
        <div class="login-screen" id="loginScreen">
            <h2>Вход в Мессенджер</h2>
            <input type="text" id="userInput" placeholder="Придумай никнейм..." maxlength="12" autocomplete="off">
            <button class="main-btn" onclick="startChatSession()">Войти в чат</button>
        </div>

        <!-- 2. ЭКРАН ЧАТА -->
        <div class="chat-header">
            <div>💬 Глобальный чат</div>
            <span id="profileLabel">Вы: Гость</span>
        </div>
        
        <div class="messages" id="chatBox"></div>
        
        <form class="input-bar" onsubmit="sendChatMessage(event)">
            <input type="text" id="messageField" placeholder="Напишите сообщение..." autocomplete="off" required>
            <button type="submit" class="main-btn" style="padding: 0 20px;">ОТПР</button>
        </form>
    </div>

    <script>
        // Подключение к серверу базы данных Google
        const firebaseConfig = {
            databaseURL: "https://firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const databaseReference = firebase.database().ref("global_chat_nodes");

        let globalNickname = "";
        const chatBox = document.getElementById('chatBox');
        const loginScreen = document.getElementById('loginScreen');

        // КНОПКА ВХОДА
        function startChatSession() {
            const enteredName = document.getElementById('userInput').value.trim();
            if (enteredName === "") {
                alert("Пожалуйста, введи свой никнейм перед входом!");
                return;
            }
            
            globalNickname = enteredName;
            document.getElementById('profileLabel').textContent = "Вы: " + globalNickname;
            loginScreen.classList.add('hidden'); // Убираем экран входа
        }

        // ОТПРАВКА
        function sendChatMessage(event) {
            event.preventDefault();
            const inputField = document.getElementById('messageField');
            const currentText = inputField.value.trim();
            
            if (!currentText || !globalNickname) return;
            
            databaseReference.push({
                user: globalNickname,
                text: currentText,
                timestamp: Date.now()
            });
            
            inputField.value = "";
        }

        // ПОЛУЧЕНИЕ СООБЩЕНИЙ
        databaseReference.limitToLast(40).on('child_added', (snapshot) => {
            const incomingData = snapshot.val();
            if (!incomingData || !incomingData.text || !incomingData.user) return;

            const isMyMessage = incomingData.user === globalNickname;
            const messageBubble = document.createElement('div');
            
            if (isMyMessage) {
                messageBubble.className = 'msg my';
                messageBubble.innerHTML = `<div>${sanitizeInput(incomingData.text)}</div>`;
            } else {
                messageBubble.className = 'msg other';
                messageBubble.innerHTML = `
                    <span class="author">${sanitizeInput(incomingData.user)}</span>
                    <div>${sanitizeInput(incomingData.text)}</div>
                `;
            }
            
            chatBox.appendChild(messageBubble);
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        function sanitizeInput(text) {
            return text.replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char] || char));
        }
    </script>
</body>
</html>
