<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Мессенджер</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a; /* Темная футуристичная тема */
            color: #f8fafc;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Окно приложения */
        .app-window {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background-color: #1e293b;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        /* 1. ЭКРАН ВХОДА */
        .login-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px;
            z-index: 10;
            transition: all 0.3s ease;
        }
        .login-screen.hidden { opacity: 0; pointer-events: none; transform: scale(0.9); }
        .login-screen h2 { font-size: 28px; text-align: center; margin-bottom: 30px; color: #38bdf8; }
        .login-input { background: #1e293b; border: 2px solid #334155; border-radius: 12px; padding: 15px; color: white; font-size: 16px; width: 100%; outline: none; margin-bottom: 20px; }
        .login-input:focus { border-color: #38bdf8; }
        .login-btn { background: #38bdf8; color: #0f172a; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }

        /* 2. ЭКРАН С ЧАТОМ */
        .chat-header { background: #1e293b; padding: 15px 20px; border-bottom: 1px solid #334155; font-weight: bold; font-size: 18px; color: #38bdf8; }
        .messages-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #0f172a; }
        
        /* Сообщения */
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.4; word-break: break-word; }
        .msg.my { background: #38bdf8; color: #0f172a; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.other { background: #334155; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg-author { font-size: 11px; opacity: 0.7; margin-bottom: 3px; font-weight: bold; }

        /* Поле ввода внизу */
        .input-bar { background: #1e293b; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #334155; }
        .input-bar input { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; color: white; outline: none; }
        .input-bar button { background: #38bdf8; border: none; color: #0f172a; padding: 0 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
    <!-- Бесплатная онлайн-база данных GunDB для мгновенной передачи сообщений -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div class="app-window">
        
        <!-- ЭКРАН ВХОДА (РЕГИСТРАЦИЯ) -->
        <div class="login-screen" id="loginScreen">
            <h2>Вход в Мессенджер</h2>
            <input type="text" id="nicknameInput" class="login-input" placeholder="Введите ваш никнейм..." maxlength="15" required>
            <button class="login-btn" onclick="enterChat()">Войти в чат</button>
        </div>

        <!-- ЭКРАН ЧАТА -->
        <div class="chat-header" id="chatHeader">💬 Глобальный чат</div>
        <div class="messages-area" id="chatArea">
            <!-- Здесь будут сообщения -->
        </div>
        <form class="input-bar" onsubmit="sendMsg(event)">
            <input type="text" id="msgInput" placeholder="Напишите сообщение..." autocomplete="off" required>
            <button type="submit">Отправить</button>
        </form>

    </div>

    <script>
        let myName = "";

        // Подключаем бесплатный сервер для обмена сообщениями
        const gun = Gun(['https://herokuapp.com']);
        const chatRoom = gun.get('super-github-messenger-room-2026');

        const loginScreen = document.getElementById('loginScreen');
        const chatArea = document.getElementById('chatArea');
        const msgInput = document.getElementById('msgInput');

        // Функция входа
        function enterChat() {
            const name = document.getElementById('nicknameInput').value.trim();
            if(!name) { alert("Введите никнейм!"); return; }
            myName = name;
            loginScreen.classList.add('hidden'); // Прячем экран входа
        }

        // Функция отправки сообщения
        function sendMsg(event) {
            event.preventDefault();
            const text = msgInput.value.trim();
            if(!text || !myName) return;

            // Сохраняем в онлайн-базу
            chatRoom.set({
                author: myName,
                text: text,
                time: Date.now()
            });

            msgInput.value = ""; // Очищаем поле ввода
        }

        // Получение сообщений в реальном времени от всех пользователей
        chatRoom.map().on((data, id) => {
            if (!data || !data.text || !data.author) return;
            if (document.getElementById(id)) return; // Чтобы сообщения не дублировались

            const msgDiv = document.createElement('div');
            msgDiv.id = id;
            
            // Если сообщение наше — красим в голубой и прижимаем вправо, если чужое — в серый влево
            if (data.author === myName) {
                msgDiv.className = 'msg my';
                msgDiv.innerHTML = `<div>${escapeHTML(data.text)}</div>`;
            } else {
                msgDiv.className = 'msg other';
                msgDiv.innerHTML = `<div class="msg-author">${escapeHTML(data.author)}</div><div>${escapeHTML(data.text)}</div>`;
            }

            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight; // Автоматически крутим чат вниз
        });

        // Защита от опасных символов
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
